name: Build & Export

on:
  push:
    branches: [main, perf-improvements]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # 4.4.1 to match the engine that actually ships and the engine the suite runs
  # under. Until 2026-07-29 this said 4.3 while the itch :web build was produced
  # locally by Godot 4.4.1 — verified from the artifact, not inferred:
  # builds/web/index.wasm contains the literal "4.4.1.stable.official". So the
  # Linux binary attached to every GitHub Release was built by an engine that
  # nothing in this project had ever tested against, and the web build players
  # actually get was built by a different engine again.
  # Tag existence checked before bumping: barichello/godot-ci:4.4.1 -> HTTP 200.
  GODOT_VERSION: "4.4.1"
  EXPORT_NAME: cowardly-irregular

jobs:
  export-linux:
    name: Linux Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
             /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true

      - name: Import project assets
        run: |
          # Capture the exit code BEFORE shaping the output. The previous form was
          #   godot --headless --import 2>&1 | tail -5 || true
          # which discarded godot's status twice over: the pipe hands back tail's
          # exit code, and `|| true` swallows whatever survived. A failed import
          # therefore passed, and the export below would then build from a project
          # whose assets never resolved — the same swallowed-verdict shape that let
          # deploy_web.sh's test gate pass a suite that never ran.
          godot --headless --audio-driver Dummy --import > import.log 2>&1; EC=$?
          tail -20 import.log
          test $EC -eq 0 || {
            echo "::error::asset import FAILED — the export step would package an incomplete project"
            exit 1
          }

      - name: Export Linux build
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/${EXPORT_NAME}.x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ github.sha }}
          path: build/linux/
          retention-days: 14

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/*
          generate_release_notes: true

  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
             /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true

      - name: Import project assets
        run: |
          godot --headless --audio-driver Dummy --import > import.log 2>&1; EC=$?
          tail -20 import.log
          test $EC -eq 0 || {
            echo "::error::asset import FAILED — the export step would package an incomplete project"
            exit 1
          }

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --audio-driver Dummy \
                --export-release "Windows Desktop" build/windows/${EXPORT_NAME}.exe > export.log 2>&1; EC=$?
          tail -20 export.log
          test $EC -eq 0 || { echo "::error::Windows export FAILED"; exit 1; }
          # Assert the artifact is a real PE binary, not a zero-byte file from an
          # export that reported success. Godot exits 0 on some partial exports.
          test -s "build/windows/${EXPORT_NAME}.exe" || {
            echo "::error::export reported success but produced no binary"; exit 1; }
          # PE32+ check with an HONEST DEGRADE. Two prior versions hard-failed when their
          # own tool was absent from barichello/godot-ci:4.4.1 — `file` (not installed) and
          # then `python3` (also not installed, exit 127, my own fix). Both reported the
          # ARTIFACT as bad. That is the failure this comment exists to stop repeating:
          # a gate that cannot MEASURE must not condemn the SUBJECT, because that failure
          # is byte-identical to a real one and it turned five runs red for nothing.
          # `test -s` above is the guard that always works; this one is a bonus that
          # SKIPS LOUDLY when it cannot run.
          # PE: "MZ" at 0, LE u32 at 0x3C -> PE header, "PE\0\0" there, optional-header
          # magic 16 bytes on == 0x20b for PE32+.
          EXE="build/windows/${EXPORT_NAME}.exe"
          if command -v od >/dev/null 2>&1; then
            mz=$(od -An -c -N2 "$EXE" | tr -d ' \n')
            if [ "$mz" != "MZ" ]; then
              echo "::error::$EXE is not a PE image (magic '$mz', expected MZ)"; exit 1
            fi
            # e_lfanew: 4 little-endian bytes at 0x3C
            pe_off=$(od -An -tu4 -j60 -N4 "$EXE" | tr -d ' \n')
            sig=$(od -An -c -j"$pe_off" -N2 "$EXE" | tr -d ' \n')
            if [ "$sig" != "PE" ]; then
              echo "::error::$EXE has no PE signature at offset $pe_off (got '$sig')"; exit 1
            fi
            magic=$(od -An -tu2 -j$((pe_off + 24)) -N2 "$EXE" | tr -d ' \n')
            # Only CONDEMN on a value we positively parsed and recognise as wrong. If od's
            # output format differs from what this expects, `magic` is non-numeric — and an
            # unparseable reading is the tool failing, not the artifact. Same rule as the
            # missing-tool branch: cannot measure => do not condemn.
            case "$magic" in
              523) echo "PE32+ verified: $EXE ($(wc -c < "$EXE") bytes)" ;;
              267) echo "::error::$EXE is PE32 (32-bit), expected PE32+ (64-bit)"; exit 1 ;;
              ''|*[!0-9]*)
                echo "::warning::could not parse the optional-header magic from od output" \
                     "('$magic') — PE32+ NOT verified. Unverified pass, not a failure." ;;
              *) echo "::error::$EXE optional-header magic $magic, expected 523 (0x20b)"; exit 1 ;;
            esac
          else
            echo "::warning::od not available — PE32+ magic NOT verified. The non-empty" \
                 "check above still passed, so this is an unverified pass, not a failure."
          fi

      # NOTE: no boot gate here. Locally, tools/deploy_windows.sh runs the exported
      # .exe under wine and asserts "[GAME] Started"; this CI image has no wine, so
      # CI proves the binary EXISTS and is well-formed, not that it RUNS. Do not
      # read a green run here as "Windows works" — that is what the local deploy
      # script is for. See docs/DEPLOYMENT_PLATFORMS.md.

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: build/windows/
          retention-days: 14

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/*
          generate_release_notes: true
